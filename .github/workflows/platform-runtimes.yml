name: Platform runtimes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect runtime changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rebuild: ${{ steps.detect.outputs.rebuild }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect native runtime inputs
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/runtime-inputs-changed.mjs \
              "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

  runtime:
    needs: changes
    if: needs.changes.outputs.rebuild == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-26
            target: darwin-arm64
          - name: Windows x64
            runner: windows-2025
            target: win32-x64
          - name: Linux x64
            runner: ubuntu-24.04
            target: linux-x64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: linux-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Build and smoke-test native runtime
        run: npm run package:runtime -- --target "${{ matrix.target }}"
      - name: Upload native runtime
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target }}
          path: dist/runtime/*
          if-no-files-found: error
          retention-days: 7
